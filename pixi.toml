[workspace]
authors = ["Ricardo Rios-Carrillo <rrioscar@uwo.ca>"]
channels = ["conda-forge"]
name = "hyades_preprint"
platforms = ["linux-64", "win-64", "osx-64"]
version = "0.1.0"

[tasks]
# Re-run all analysis notebooks in place; their outputs (figures, tables) are embedded in the paper
run-notebooks = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.record_timing=False demographics.ipynb section1_wholebrain.ipynb section2_hippocampus.ipynb", cwd = "content", description = "Re-run all analysis notebooks in place" }

# Re-run the notebooks and also write the static figure versions to static/figures/ (not tracked):
# pixi run static-figures [png|pdf|svg]  (default png; several formats as a comma list, e.g. png,svg)
# PNG (raster), PDF (vector, for the journal later), SVG (editable text) for Inkscape
static-figures = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.record_timing=False demographics.ipynb section1_wholebrain.ipynb section2_hippocampus.ipynb", cwd = "content", args = [{ arg = "format", default = "png" }], env = { STATIC_FIGURE_FORMATS = "{{ format }}" }, description = "Re-run notebooks and write static figures: pixi run static-figures [png|pdf|svg] (default png)" }

# Binder/NeuroLibre runtime: conda environment generated from this file, pinned to the linux-64 versions in pixi.lock
binder-env = { cmd = "pixi workspace export conda-environment --platform linux-64 binder/environment.yml && python binder/pin_environment.py", description = "Regenerate binder/environment.yml from pixi.toml, pinned to the linux-64 versions in pixi.lock (run after changing dependencies)" }

[target.win-64.activation.env]
# rpy2 cannot use its API mode on Windows; use ABI mode directly to avoid the fallback message
RPY2_CFFI_MODE = "ABI"

[dependencies]
python = "3.13.*"
mystmd = ">=1.10.1,<2" # mystmd
seaborn = ">=0.13.2,<0.14"
pandas = ">=3.0.3,<4"
scipy = ">=1.18.0,<2"
numpy = ">=2.5.0,<3"
matplotlib = ">=3.11.0,<4"
statsmodels = ">=0.14.6,<0.15"
ipykernel = ">=7.3.0,<8" # for jupyter notebook
rpy2 = ">=3.6.4,<4" # R conector
plotly = ">=6.8.0,<7"
r-base = ">=4.4.3,<4.6" # For R
r-effectsize = ">=1.0.2,<2"
r-car = ">=3.1_5,<4"
r-marginaleffects = ">=0.32.0,<0.33"
tableone = ">=0.9.6,<0.10"
nbconvert = ">=7.17.1,<8"
jupyter_server = ">=2.21.1,<3"
tabulate = ">=0.10.0,<0.11"

